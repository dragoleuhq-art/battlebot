<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion TikTok</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 18px;line-height:1.6;color:#222}h1{font-size:24px}code{background:#eee;padding:2px 6px;border-radius:6px}</style></head><body><h1>Connexion TikTok…</h1><p id="msg">Redirection vers ton panneau…</p><script>
(function(){
  var q = new URLSearchParams(location.search);
  var st = q.get('state') || '';
  var i = st.indexOf('.');
  var target = '';
  if (i > -1) {
    try {
      var b = st.slice(i + 1).replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      target = atob(b);
    } catch (e) {}
  }
  if (/^https?:\/\/[^\s]+$/.test(target) && q.get('code')) {
    location.replace(target.replace(/\/$/, '') + '/oauth/tiktok' + location.search);
  } else {
    document.getElementById('msg').textContent =
      q.get('error') ? 'Connexion refusée : ' + q.get('error') :
      'Copie l\'adresse de cette page et colle-la dans le bot ou le panneau.';
  }
})();
</script></body></html>
